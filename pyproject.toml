[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is prefixed; the importable module stays `packctl`, the
# same split the py3d fork uses. Without an install, `python -m packctl` only
# resolves while the shell happens to be standing in the repository root --
# which is an unstated precondition, not a contract.
name = "dayz-packctl"
dynamic = ["version"]
description = "Deterministic validation, gating, packaging and promotion CLI for the DayZ Modding Knowledge Pack."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Guillermo", email = "willy92wins@gmail.com"},
]
# Stdlib only, deliberately: the gate has to run offline and deterministically
# on a machine that installed nothing else. The external Agent Skills validator
# it shells out to is pinned by PACK_SKILLS_REF_ROOT, not depended on here.
dependencies = []

[project.scripts]
packctl = "packctl.cli:main"

[tool.setuptools]
packages = ["packctl"]

[tool.setuptools.dynamic]
version = {attr = "packctl.__version__"}
