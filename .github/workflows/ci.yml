# Offline pack contract for a clean Windows runner.
# Does not invoke the skills-ref gate; PACK_SKILLS_REF_ROOT is not on this runner.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-contract:
    name: pack-contract
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      - name: Validate pack
        run: python -m packctl validate --root . --report "$env:RUNNER_TEMP\pack-validate.json"

      - name: Test packctl
        run: python -m pytest -q -p no:cacheprovider tests/packctl
