# Offline pack contract for a clean Windows runner.
# Does not invoke the skills-ref gate; PACK_SKILLS_REF_ROOT is not on this runner.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-contract:
    name: pack-contract
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      - name: Validate pack
        run: python -m packctl validate --root . --report "$env:RUNNER_TEMP\pack-validate.json"

      - name: Test packctl
        run: python -m pytest -q -p no:cacheprovider tests/packctl

      # Each skills/<skill>/tests folder in its own pytest process, with the
      # rule packctl/gate.py applies: exit 0 passes, exit 5 (no test collected)
      # passes only when the JUnit report records a skip, anything else fails.
      # tools/<tool>/tests stay gate-only: five of them need packages this
      # runner does not install (jsonschema, numpy, Pillow, py3d).
      - name: Test skills
        run: |
          $failed = @()
          foreach ($skill in Get-ChildItem -Path skills -Directory) {
            $suite = Join-Path $skill.FullName 'tests'
            if (-not (Test-Path -LiteralPath $suite -PathType Container)) { continue }
            $junit = Join-Path $env:RUNNER_TEMP "skill-tests-$($skill.Name).xml"
            python -m pytest -q -p no:cacheprovider -rs "--junitxml=$junit" $suite
            $exit = $LASTEXITCODE
            $passed = $exit -eq 0
            if ($exit -eq 5 -and (Test-Path -LiteralPath $junit)) {
              $skipped = ([xml](Get-Content -Raw -LiteralPath $junit)).testsuites.testsuite |
                Measure-Object -Property skipped -Sum
              $passed = $skipped.Sum -gt 0
            }
            if (-not $passed) { $failed += "$($skill.Name) (exit $exit)" }
          }
          if ($failed.Count -gt 0) {
            Write-Output "::error::Skill test folders failed: $($failed -join ', ')"
            exit 1
          }
          # The runner ends the script with `exit $LASTEXITCODE`, which would
          # turn a cleanly skipped last folder (exit 5) into a failed step.
          exit 0
