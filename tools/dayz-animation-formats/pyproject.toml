[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-animation-formats"
version = "0.1.0"
description = "Strict SEAnim v1 and unbinarized DayZ RTM interchange"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "DayZ Modding Knowledge Pack contributors"}]
dependencies = []

[project.scripts]
dayz-animation-formats = "dayz_animation_formats.__main__:main"

[tool.setuptools.packages.find]
include = ["dayz_animation_formats*"]
