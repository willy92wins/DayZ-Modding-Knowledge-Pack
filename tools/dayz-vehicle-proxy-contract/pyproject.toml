[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-vehicle-proxy-contract"
version = "0.1.0"
description = "Offline vehicle proxy contract auditor for DayZ mods"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DayZ Modding Knowledge Pack contributors"}]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.scripts]
dayz-vehicle-proxy-contract = "dayz_vehicle_proxy_contract.__main__:main"

[tool.setuptools.packages.find]
include = ["dayz_vehicle_proxy_contract*"]
