[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-layout-viewer"
version = "0.1.0"
description = "Approximate self-contained HTML preview of a DayZ .layout at four viewports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "DayZ Modding Knowledge Pack contributors"}]
dependencies = []

[project.scripts]
dayz-layout-viewer = "dayz_layout_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["dayz_layout_viewer*"]
