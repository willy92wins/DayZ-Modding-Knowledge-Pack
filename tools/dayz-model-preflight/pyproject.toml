[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-model-preflight"
version = "0.1.0"
description = "Contract-driven read-only preflight for DayZ MLOD models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "DayZ Modding Knowledge Pack contributors"}]
dependencies = []

[project.scripts]
dayz-model-preflight = "dayz_model_preflight.__main__:main"

[tool.setuptools.packages.find]
include = ["dayz_model_preflight*"]
