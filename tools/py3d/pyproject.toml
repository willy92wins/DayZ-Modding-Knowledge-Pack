[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name: NOT "py3d" - that name is taken on PyPI by an unrelated
# library (Tumiz, GPL-3.0, 93 releases). The importable module stays `py3d`
# so existing code keeps working: `import py3d`.
name = "py3d-dayz"
dynamic = ["version"]
description = "DayZ/Arma MLOD .p3d reader and writer - a maintained fork of KoffeinFlummi/py3d with anti-corruption guards and a DayZ model validator."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Authorship of THIS fork. The original library is by Felix "KoffeinFlummi"
# Wiegand and its MIT copyright is preserved verbatim in LICENSE; see
# [project.urls] Upstream. Listing him as author of the fork's ~2200 added
# lines would misattribute them and route this fork's bugs to his tracker.
authors = [
    {name = "Guillermo", email = "willy92wins@gmail.com"},
]
dependencies = []
keywords = ["arma", "dayz", "3d", "p3d", "mlod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/willy92wins/py3d-dayz"
Upstream = "https://github.com/KoffeinFlummi/py3d"

[tool.setuptools.dynamic]
version = {attr = "py3d.__version__"}

[tool.setuptools.packages.find]
include = ["py3d*"]
